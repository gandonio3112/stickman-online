<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Stickman Online LAN Battle</title>
    <!-- Подключаем PeerJS для связи между игроками без своего сервера -->
    <script src="https://unpkg.com"></script>
    <style>
        body {
            background-color: #1e1e2e;
            color: #cdd6f4;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        #ui-panel {
            background: #313244;
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: flex;
            gap: 15px;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        input {
            padding: 8px 12px;
            border-radius: 5px;
            border: none;
            background: #45475a;
            color: white;
            font-size: 16px;
        }
        button {
            padding: 8px 16px;
            border-radius: 5px;
            border: none;
            background: #89b4fa;
            color: #11111b;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background: #b4befe; }
        canvas {
            background-color: #11111b;
            border: 3px solid #45475a;
            border-radius: 8px;
        }
        .controls-hint {
            margin-top: 10px;
            color: #a6adc8;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h2>⚔️ Битва Стикменов (Локальная сеть / Онлайн)</h2>

    <div id="ui-panel">
        <div>Твой ID: <strong id="my-id">Генерация...</strong></div>
        <input type="text" id="peer-id-input" placeholder="Введи ID друга">
        <button onclick="connectToPeer()">Подключиться</button>
        <div id="status" style="color: #f9e2af;">Ожидание...</div>
    </div>

    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <div class="controls-hint">Управление: <b>A / D</b> — бег, <b>W</b> — прыжок, <b>Пробел</b> — удар</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Настройки сети (PeerJS)
        // Генерируем короткий 4-значный ID для удобства ввода в локалке
        const shortId = Math.floor(1000 + Math.random() * 9000).toString();
        const peer = new Peer(shortId);
        let conn = null;
        let isHost = true;

        peer.on('open', (id) => {
            document.getElementById('my-id').innerText = id;
        });

        // Если кто-то подключился к нам (мы Хост)
        peer.on('connection', (connection) => {
            conn = connection;
            isHost = true;
            setupConnection();
        });

        // Если мы подключаемся к другу (мы Клиент)
        function connectToPeer() {
            const friendId = document.getElementById('peer-id-input').value.trim();
            if (!friendId) return;
            conn = peer.connect(friendId);
            isHost = false;
            // Меняем стартовые позиции для клиента
            me.x = 600; me.color = '#f38ba8'; me.facing = -1;
            enemy.x = 200; enemy.color = '#89b4fa'; enemy.facing = 1;
            setupConnection();
        }

        function setupConnection() {
            document.getElementById('status').innerText = "Подключено! В бой!";
            document.getElementById('status').style.color = "#a6e3a1";

            conn.on('data', (data) => {
                // Получаем координаты и состояние врага
                enemy.x = data.x;
                enemy.y = data.y;
                enemy.facing = data.facing;
                enemy.isAttacking = data.isAttacking;
                if (data.hitEnemy) {
                    me.hp -= 10;
                    if (me.hp < 0) me.hp = 0;
                }
            });
        }

        // Игровые объекты
        const gravity = 0.6;
        const groundY = 350;

        let me = { x: 200, y: groundY, vx: 0, vy: 0, hp: 100, color: '#89b4fa', facing: 1, isAttacking: false, attackCooldown: 0 };
        let enemy = { x: 600, y: groundY, hp: 100, color: '#f38ba8', facing: -1, isAttacking: false };

        // Управление
        const keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        function update() {
            // Движение
            if (keys['KeyA']) { me.vx = -5; me.facing = -1; }
            else if (keys['KeyD']) { me.vx = 5; me.facing = 1; }
            else { me.vx = 0; }

            // Прыжок
            if (keys['KeyW'] && me.y >= groundY) {
                me.vy = -13;
            }

            // Атака
            let hitEnemyNow = false;
            if (me.attackCooldown > 0) me.attackCooldown--;
            if (keys['Space'] && me.attackCooldown === 0) {
                me.isAttacking = true;
                me.attackCooldown = 25; // Кулдаун удара
                
                // Проверка попадания
                const reach = 65;
                const dist = Math.abs((me.x + me.facing * 30) - enemy.x);
                const heightDiff = Math.abs(me.y - enemy.y);
                if (dist < reach && heightDiff < 50) {
                    enemy.hp -= 10;
                    if (enemy.hp < 0) enemy.hp = 0;
                    hitEnemyNow = true;
                }
                setTimeout(() => me.isAttacking = false, 150);
            }

            // Физика
            me.x += me.vx;
            me.y += me.vy;
            if (me.y < groundY) me.vy += gravity;
            else { me.y = groundY; me.vy = 0; }

            // Границы экрана
            if (me.x < 30) me.x = 30;
            if (me.x > canvas.width - 30) me.x = canvas.width - 30;

            // Отправка данных второму игроку
            if (conn && conn.open) {
                conn.send({
                    x: me.x,
                    y: me.y,
                    facing: me.facing,
                    isAttacking: me.isAttacking,
                    hitEnemy: hitEnemyNow
                });
            }
        }

        // Отрисовка стикмена
        function drawStickman(p) {
            ctx.strokeStyle = p.color;
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';

            // Голова
            ctx.beginPath();
            ctx.arc(p.x, p.y - 70, 12, 0, Math.PI * 2);
            ctx.stroke();

            // Тело
            ctx.beginPath();
            ctx.moveTo(p.x, p.y - 58);
            ctx.lineTo(p.x, p.y - 25);
            ctx.stroke();

            // Ноги
            ctx.beginPath();
            ctx.moveTo(p.x, p.y - 25);
            ctx.lineTo(p.x - 12, p.y);
            ctx.moveTo(p.x, p.y - 25);
            ctx.lineTo(p.x + 12, p.y);
            ctx.stroke();

            // Руки (если бьет — вытягивает руку вперед)
            ctx.beginPath();
            ctx.moveTo(p.x, p.y - 50);
            if (p.isAttacking) {
                ctx.lineTo(p.x + (45 * p.facing), p.y - 50);
            } else {
                ctx.lineTo(p.x + (15 * p.facing), p.y - 35);
            }
            ctx.stroke();

            // Полоска здоровья
            ctx.fillStyle = '#45475a';
            ctx.fillRect(p.x - 25, p.y - 100, 50, 6);
            ctx.fillStyle = p.hp > 30 ? '#a6e3a1' : '#f38ba8';
            ctx.fillRect(p.x - 25, p.y - 100, 50 * (p.hp / 100), 6);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Пол
            ctx.strokeStyle = '#585b70';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, groundY + 2);
            ctx.lineTo(canvas.width, groundY + 2);
            ctx.stroke();

            drawStickman(me);
            drawStickman(enemy);

            // Экран победы/поражения
            if (me.hp <= 0 || enemy.hp <= 0) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 40px sans-serif';
                ctx.textAlign = 'center';
                const text = me.hp <= 0 ? "ТЫ ПРОИГРАЛ! (Обнови страницу)" : "ПОБЕДА! (Обнови страницу)";
                ctx.fillText(text, canvas.width / 2, canvas.height / 2);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
