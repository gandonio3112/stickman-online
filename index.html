    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Генерируем более уникальный ID с префиксом игры, чтобы не конфликтовать с другими
        const shortId = 'stk-' + Math.floor(1000 + Math.random() * 9000);
        
        // Настройки подключения с публичными STUN-серверами Google
        const peer = new Peer(shortId, {
            debug: 2,
            config: {
                'iceServers': [
                    { urls: 'stun:://google.com' },
                    { urls: 'stun:://google.com' }
                ]
            }
        });

        let conn = null;
        let isHost = true;

        peer.on('open', (id) => {
            // Показываем пользователю только 4 цифры для удобства
            document.getElementById('my-id').innerText = id.replace('stk-', '');
        });

        // Показываем ошибку, если сервер PeerJS недоступен
        peer.on('error', (err) => {
            document.getElementById('my-id').innerText = 'Ошибка!';
            document.getElementById('status').innerText = 'Ошибка сети: ' + err.type;
            document.getElementById('status').style.color = '#f38ba8';
            console.error(err);
        });

        peer.on('connection', (connection) => {
            conn = connection;
            isHost = true;
            setupConnection();
        });

        function connectToPeer() {
            const rawInput = document.getElementById('peer-id-input').value.trim();
            if (!rawInput) return;
            // Добавляем префикс обратно при подключении
            const friendId = rawInput.startsWith('stk-') ? rawInput : 'stk-' + rawInput;
            
            document.getElementById('status').innerText = "Подключение...";
            conn = peer.connect(friendId);
            isHost = false;
            
            me.x = 600; me.color = '#f38ba8'; me.facing = -1;
            enemy.x = 200; enemy.color = '#89b4fa'; enemy.facing = 1;
            setupConnection();
        }

        function setupConnection() {
            conn.on('open', () => {
                document.getElementById('status').innerText = "Подключено! В бой!";
                document.getElementById('status').style.color = "#a6e3a1";
            });

            conn.on('data', (data) => {
                enemy.x = data.x;
                enemy.y = data.y;
                enemy.facing = data.facing;
                enemy.isAttacking = data.isAttacking;
                if (data.hitEnemy) {
                    me.hp -= 10;
                    if (me.hp < 0) me.hp = 0;
                }
            });
        }

        // --- Остальной игровой код без изменений ---
        const gravity = 0.6;
        const groundY = 350;

        let me = { x: 200, y: groundY, vx: 0, vy: 0, hp: 100, color: '#89b4fa', facing: 1, isAttacking: false, attackCooldown: 0 };
        let enemy = { x: 600, y: groundY, hp: 100, color: '#f38ba8', facing: -1, isAttacking: false };

        const keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        function update() {
            if (keys['KeyA']) { me.vx = -5; me.facing = -1; }
            else if (keys['KeyD']) { me.vx = 5; me.facing = 1; }
            else { me.vx = 0; }

            if (keys['KeyW'] && me.y >= groundY) {
                me.vy = -13;
            }

            let hitEnemyNow = false;
            if (me.attackCooldown > 0) me.attackCooldown--;
            if (keys['Space'] && me.attackCooldown === 0) {
                me.isAttacking = true;
                me.attackCooldown = 25;
                
                const reach = 65;
                const dist = Math.abs((me.x + me.facing * 30) - enemy.x);
                const heightDiff = Math.abs(me.y - enemy.y);
                if (dist < reach && heightDiff < 50) {
                    enemy.hp -= 10;
                    if (enemy.hp < 0) enemy.hp = 0;
                    hitEnemyNow = true;
                }
                setTimeout(() => me.isAttacking = false, 150);
            }

            me.x += me.vx;
            me.y += me.vy;
            if (me.y < groundY) me.vy += gravity;
            else { me.y = groundY; me.vy = 0; }

            if (me.x < 30) me.x = 30;
            if (me.x > canvas.width - 30) me.x = canvas.width - 30;

            if (conn && conn.open) {
                conn.send({
                    x: me.x,
                    y: me.y,
                    facing: me.facing,
                    isAttacking: me.isAttacking,
                    hitEnemy: hitEnemyNow
                });
            }
        }

        function drawStickman(p) {
            ctx.strokeStyle = p.color;
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';

            ctx.beginPath();
            ctx.arc(p.x, p.y - 70, 12, 0, Math.PI * 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(p.x, p.y - 58);
            ctx.lineTo(p.x, p.y - 25);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(p.x, p.y - 25);
            ctx.lineTo(p.x - 12, p.y);
            ctx.moveTo(p.x, p.y - 25);
            ctx.lineTo(p.x + 12, p.y);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(p.x, p.y - 50);
            if (p.isAttacking) {
                ctx.lineTo(p.x + (45 * p.facing), p.y - 50);
            } else {
                ctx.lineTo(p.x + (15 * p.facing), p.y - 35);
            }
            ctx.stroke();

            ctx.fillStyle = '#45475a';
            ctx.fillRect(p.x - 25, p.y - 100, 50, 6);
            ctx.fillStyle = p.hp > 30 ? '#a6e3a1' : '#f38ba8';
            ctx.fillRect(p.x - 25, p.y - 100, 50 * (p.hp / 100), 6);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#585b70';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, groundY + 2);
            ctx.lineTo(canvas.width, groundY + 2);
            ctx.stroke();

            drawStickman(me);
            drawStickman(enemy);

            if (me.hp <= 0 || enemy.hp <= 0) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 40px sans-serif';
                ctx.textAlign = 'center';
                const text = me.hp <= 0 ? "ТЫ ПРОИГРАЛ! (Обнови страницу)" : "ПОБЕДА! (Обнови страницу)";
                ctx.fillText(text, canvas.width / 2, canvas.height / 2);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
        loop();
    </script>
