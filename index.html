<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Stickman Battle Online</title>
<script src="https://unpkg.com"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; user-select: none; }
  body { background: #12141a; color: #fff; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .panel { width: 760px; background: #1c1f29; padding: 12px 18px; border-radius: 10px 10px 0 0; border: 2px solid #2d3242; border-bottom: none; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .title { font-weight: bold; font-size: 18px; color: #00e5ff; }
  .net { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  input { background: #12141a; border: 1px solid #3a4052; color: #28c76f; padding: 6px 10px; border-radius: 6px; width: 145px; outline: none; font-weight: bold; }
  button { background: #28c76f; color: #fff; border: none; padding: 7px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }
  button:hover { background: #20a85c; }
  canvas { background: #0e1015; border: 2px solid #2d3242; display: block; box-shadow: 0 12px 30px rgba(0,0,0,0.6); }
  .footer { width: 760px; background: #181a22; padding: 10px 18px; border-radius: 0 0 10px 10px; border: 2px solid #2d3242; border-top: none; display: flex; justify-content: space-between; font-size: 13px; color: #aab2c5; }
  b { color: #fff; }
</style>
</head>
<body>

<div class="panel">
  <div class="title">⚔️ STICKMAN ONLINE</div>
  <div class="net">
    <span>Комната:</span>
    <input id="room-name" value="arena777" placeholder="Код комнаты">
    <button onclick="joinRoom()">В бой!</button>
  </div>
</div>

<canvas id="game" width="760" height="410"></canvas>

<div class="footer">
  <div><b>A / D</b> — бег | <b>W</b> — 2x прыжок | <b>S</b> — блок | <b>F</b> — удар | <b>E</b> — шар | <b>Q</b> — супер</div>
  <div id="status" style="color:#ffd54f">Введи комнату и жми "В бой!"</div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');

const platforms = [
  { x: 0, y: 370, w: 760, h: 40 },
  { x: 110, y: 270, w: 180, h: 14 },
  { x: 470, y: 270, w: 180, h: 14 },
  { x: 290, y: 180, w: 180, h: 14 }
];

const myId = 'u_' + Math.random().toString(36).slice(2, 8);
let isSecondPlayer = false;

let me = { x: 160, y: 330, vx: 0, vy: 0, hp: 100, energy: 0, dir: 1, jumps: 0, block: false, punch: 0, color: '#00e5ff' };
let enemy = { x: 600, y: 330, hp: 100, dir: -1, block: false, punch: 0, color: '#ff3d71' };
let bullets = [];
let keys = {};
let cd = 0;

window.onkeydown = e => keys[e.code] = true;
window.onkeyup = e => keys[e.code] = false;
let client = null;
let topic = '';
let lastSend = 0;

function joinRoom() {
  if (typeof mqtt === 'undefined') {
    statusEl.style.color = '#ff5555';
    statusEl.innerText = 'Ошибка: скрипт MQTT не загрузился (блокировка unpkg)';
    return;
  }

  const room = document.getElementById('room-name').value.trim();
  if (!room) return;
  if (client) client.end();

  isSecondPlayer = false;
  me.x = 160; me.dir = 1; me.color = '#00e5ff';
  enemy.x = 600; enemy.dir = -1; enemy.color = '#ff3d71';

  statusEl.style.color = '#ffd54f';
  statusEl.innerText = 'Подключение к Mosquitto...';
  topic = 'gh_stickman_pvp_barnaul/' + room;

  client = mqtt.connect('wss://test.mosquitto.org:8081');

  client.on('connect', () => {
    client.subscribe(topic);
    statusEl.style.color = '#28c76f';
    statusEl.innerText = 'В комнате "' + room + '"! Ждём друга...';
    send({ type: 'join' });
  });

  client.on('error', err => {
    statusEl.style.color = '#ff5555';
    statusEl.innerText = 'Ошибка сервера: ' + err.message;
  });

  client.on('message', (t, msg) => {
    try {
      const data = JSON.parse(msg.toString());
      if (data.sender === myId) return;

      if (data.type === 'join') {
        send({ type: 'welcome' });
        statusEl.style.color = '#28c76f';
        statusEl.innerText = 'СОПЕРНИК ПОДКЛЮЧИЛСЯ (ТЫ СИНИЙ)!';
      } else if (data.type === 'welcome' && !isSecondPlayer) {
        isSecondPlayer = true;
        me.x = 600; me.dir = -1; me.color = '#ff3d71';
        enemy.x = 160; enemy.dir = 1; enemy.color = '#00e5ff';
        statusEl.style.color = '#28c76f';
        statusEl.innerText = 'СОПЕРНИК ПОДКЛЮЧИЛСЯ (ТЫ КРАСНЫЙ)!';
      } else if (data.type === 'sync') {
        enemy.x = data.x; enemy.y = data.y;
        enemy.hp = data.hp; enemy.dir = data.dir;
        enemy.block = data.block; enemy.punch = data.punch;
      } else if (data.type === 'shot') {
        bullets.push({ x: data.x, y: data.y, vx: data.vx, r: data.r, dmg: data.dmg, owner: 'enemy' });
      } else if (data.type === 'dmg') {
        let realDmg = me.block ? Math.ceil(data.dmg / 3) : data.dmg;
        me.hp = Math.max(0, me.hp - realDmg);
      } else if (data.type === 'reset') {
        resetMatch();
      }
    } catch (e) {}
  });
}

function send(obj) {
  if (client && client.connected && topic) {
    obj.sender = myId;
    client.publish(topic, JSON.stringify(obj));
  }
}

function resetMatch() {
  me.x = isSecondPlayer ? 600 : 160;
  me.y = 330; me.hp = 100; me.energy = 0;
  enemy.hp = 100; bullets = [];
}

function drawStickman(p) {
  ctx.strokeStyle = p.color;
  ctx.lineWidth = 4;

  ctx.beginPath(); ctx.arc(p.x, p.y - 45, 10, 0, Math.PI * 2); ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(p.x, p.y - 35); ctx.lineTo(p.x, p.y - 10);
  ctx.lineTo(p.x - 11, p.y + 15);
  ctx.moveTo(p.x, p.y - 10); ctx.lineTo(p.x + 11, p.y + 15);

  let fistX = p.punch > 0 ? p.x + p.dir * 30 : p.x + p.dir * 13;
  ctx.moveTo(p.x - p.dir * 10, p.y - 25); ctx.lineTo(fistX, p.y - 25);
  ctx.stroke();

  if (p.block) {
    ctx.strokeStyle = '#ffd54f';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(p.x + p.dir * 14, p.y - 22, 24, -1.2, 1.2);
    ctx.stroke();
  }

  ctx.fillStyle = '#222';
  ctx.fillRect(p.x - 25, p.y - 68, 50, 6);
  ctx.fillStyle = p.color;
  ctx.fillRect(p.x - 25, p.y - 68, (p.hp / 100) * 50, 6);
}

function loop() {
  ctx.fillStyle = '#0e1015';
  ctx.fillRect(0, 0, 760, 410);

  ctx.fillStyle = '#262b38';
  platforms.forEach(pl => ctx.fillRect(pl.x, pl.y, pl.w, pl.h));

  if (me.hp > 0 && enemy.hp > 0) {
    me.block = !!keys['KeyS'];
    let spd = me.block ? 1.8 : 4.5;

    if (keys['KeyA']) { me.x -= spd; me.dir = -1; }
    if (keys['KeyD']) { me.x += spd; me.dir = 1; }
    me.x = Math.max(20, Math.min(740, me.x));

    if (keys['KeyW'] && !keys['jumpLock'] && me.jumps < 2) {
      me.vy = -10.5;
      me.jumps++;
      keys['jumpLock'] = true;
    }
    if (!keys['KeyW']) keys['jumpLock'] = false;

    if (cd > 0) cd--;
    if (me.punch > 0) me.punch--;
    me.energy = Math.min(100, me.energy + 0.14);

    if (keys['KeyF'] && cd === 0 && !me.block) {
      me.punch = 10; cd = 20;
      if (Math.abs(me.x - enemy.x) < 55 && Math.abs(me.y - enemy.y) < 42) {
        let dmg = enemy.block ? 4 : 12;
        enemy.hp = Math.max(0, enemy.hp - dmg);
        me.energy = Math.min(100, me.energy + 15);
        send({ type: 'dmg', dmg: 12 });
      }
    }

    if (keys['KeyE'] && cd === 0 && !me.block) {
      cd = 28;
      let b = { x: me.x + me.dir * 22, y: me.y - 25, vx: me.dir * 8, r: 6, dmg: 14, owner: 'me' };
      bullets.push(b);
      send({ type: 'shot', x: b.x, y: b.y, vx: b.vx, r: b.r, dmg: b.dmg });
    }

    if (keys['KeyQ'] && me.energy >= 100 && !me.block) {
      me.energy = 0; cd = 35;
      let b = { x: me.x + me.dir * 28, y: me.y - 25, vx: me.dir * 10, r: 15, dmg: 32, owner: 'me' };
      bullets.push(b);
      send({ type: 'shot', x: b.x, y: b.y, vx: b.vx, r: b.r, dmg: b.dmg });
    }
  }

  let prevY = me.y + 15;
  me.y += me.vy;
  me.vy += 0.55;
  let footY = me.y + 15;

  platforms.forEach(pl => {
    if (me.vy >= 0 && prevY <= pl.y + 4 && footY >= pl.y && me.x >= pl.x && me.x <= pl.x + pl.w) {
      me.y = pl.y - 15;
      me.vy = 0;
      me.jumps = 0;
    }
  });

  for (let i = bullets.length - 1; i >= 0; i--) {
    let b = bullets[i];
    b.x += b.vx;
    ctx.fillStyle = b.owner === 'me' ? me.color : enemy.color;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();

    if (b.owner === 'me' && Math.abs(b.x - enemy.x) < 22 + b.r && Math.abs(b.y - (enemy.y - 25)) < 32) {
      let dmg = enemy.block ? Math.ceil(b.dmg / 3) : b.dmg;
      enemy.hp = Math.max(0, enemy.hp - dmg);
      me.energy = Math.min(100, me.energy + 10);
      send({ type: 'dmg', dmg: b.dmg });
      bullets.splice(i, 1);
    } else if (b.x < -30 || b.x > 790) {
      bullets.splice(i, 1);
    }
  }

  ctx.fillStyle = '#222'; ctx.fillRect(20, 18, 160, 10);
  ctx.fillStyle = me.energy >= 100 ? '#ffd54f' : '#3b82f6';
  ctx.fillRect(20, 18, (me.energy / 100) * 160, 10);
  ctx.fillStyle = '#fff'; ctx.font = '12px sans-serif';
  ctx.fillText(me.energy >= 100 ? 'СУПЕР-УДАР ГОТОВ (Q)!' : 'Энергия: ' + Math.floor(me.energy) + '%', 20, 42);

  if (Date.now() - lastSend > 45) {
    lastSend = Date.now();
    send({ type: 'sync', x: me.x, y: me.y, hp: me.hp, dir: me.dir, block: me.block, punch: me.punch });
  }

  drawStickman(me);
  drawStickman(enemy);

  if (me.hp <= 0 || enemy.hp <= 0) {
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(0, 0, 760, 410);
    ctx.fillStyle = '#ffd54f';
    ctx.font = 'bold 34px sans-serif';
    ctx.fillText(me.hp <= 0 ? 'ТЫ ПРОИГРАЛ!' : 'ПОБЕДА!', 285, 185);
    ctx.fillStyle = '#fff';
    ctx.font = '16px sans-serif';
    ctx.fillText('Нажми R для нового раунда', 280, 225);
    if (keys['KeyR']) { resetMatch(); send({ type: 'reset' }); }
  }

  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
